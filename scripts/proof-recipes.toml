[[recipe]]
id = "message-execution-settlement"
status = "active"
triggers = ["goal-shape:message-execution-settlement"]
preferred_path = "The message-execution adapters and message-entry projections are Jaune's (`Jaune.MessageExecution`, imported through `Blanc/MessageExecution.lean`; Blanc opens `Jaune`, so the short names below resolve). Use `MessageExecution.processMessage_eq_settle_exec_of_enter` when an exact successful `Frame.enter` equation is already retained, including for delegated children. For payable ordinary calls, derive a normal non-precompile entry with `executeCode_enter_of_codeAddress_not_precompile` and use the `*_afterTransfer_of_codeEntry` adapters; the `*_afterTransfer_of_notPrecompile` bridge packages the same route from address evidence. Use `processMessage_eq_settle_exec_afterTransfer_of_noCodeAddress` for creation-code entry, or `processMessage_eq_settle_exec_afterTransfer` when precompiles are explicitly disabled. Then use the clean/revert/halt adapters and canonical `settledRevert` or `settledHalt` machines instead of unfolding message settlement at the contract site. Use the unsuffixed adapters for the identity-entry specialization. For an already-retained `ProcessMessage`, use Blanc's `MessageExecution.processMessage_clean_rawPost` to recover the successful raw post, `processMessage_entry_facts` for the actual entry frame projections, and the separate `processMessage_entry_stack` / `processMessage_entry_memory` empty-entry projections. For an actual retained zero-value static-precompile child whose routing already selected the native precompile, use `stor_of_processMessage_staticPrecomp`; at address `0x2` on exactly 64 input bytes, use `gasSha25664_le_of_processMessage_clean`, `output_of_processMessage_sha256_64_clean`, or their combined `frame_of_processMessage_sha256_64_clean` image."
boundary = "The generic enter bridge requires only the exact successful entry equation. Post-transfer bridges name the successful transferred environment: exact-code-entry and non-precompile variants work with ordinary `disablePrecompiles = false` messages, the no-code-address variant covers creation code, and the convenience bridge requires disabled precompiles. The unsuffixed specialization additionally requires entry-state identity. Retained-frame inversion exposes storage equality rather than whole-state equality because value transfer may change balances. Static-precompile inversion does not prove native routing: its enabled-precompile and clean-child premises remain load-bearing, delegation must already be ruled out, and the SHA result is fixed only for address 2 and exactly 64 bytes. These facts describe ordinary call-message settlement, not CREATE settlement."

id = "retained-wrapper-trace"
status = "active"
triggers = ["goal-shape:retained-wrapper-trace"]
preferred_path = "Choose the carrier at the wrapper boundary you actually have, then use its matching `exists_*Trace` theorem to retain Jaune's deterministic recursive witness. Start with `RetainedXlot` for a filled execution slot; use `ProcessMessageTrace.result` or `ProcessCreateMessageTrace.result` to recover the exact deterministic core-wrapper equation. At a retained delegated-child boundary, use `DelegatecallSpawnDescriptor.certificate_of_runCompiled` to invert an existing successful compiled step into its arbitrary child outcome and resume equation, `DelegatecallSpawnDescriptor.runCompiled_of_certificate` to construct the exact compiled step from such a child plus its resume equation, or `.settled_of_runCompiled` to retain the settled child together with exact parent observations. Then use `DelegatedChildCertificate.process`, `.result`, or `.rollback_of_error` for the retained child. Use `MessageCallTrace`, `TransactionTrace`, `AppliedBodyTrace`, or the configured block/history carriers instead of reconstructing a trace from only the terminal state. For a successful message call, transaction, transaction fold or unchecked system transaction with the actual selected rules satisfying `stateGas = none`, use `exists_messageCallTrace_of_stateGas_none`, `exists_transactionTrace_of_stateGas_none`, `exists_applyTransactionsTrace_of_stateGas_none` or `exists_systemMessageTrace_of_stateGas_none`, respectively. The original CoveredFork entry points remain compatibility wrappers. For supplied optional beacon/history/request stages, use BeaconStageTrace, HistoryStageTrace and RequestStageTrace; StagedBodyTrace and ConfiguredBlockTraceIn/ConfiguredHistoryTraceIn retain exact selected-fork stages. Use ExecutionStagedFrames rawFrames or settledFrames at the required traversal boundary, disabled-stage nil lemmas and mem_rawFrames_of_mem_settledFrames to transport only membership. The modern toStaged/toModern/toIn projection equalities reuse the supplied traces. Historical body extraction uses exists_stagedBodyTrace and conditional request coverage; configured In extraction retains its explicit reward-inclusive budget."
boundary = "These carriers remember execution and wrapper structure but assign no contract-specific meaning to effects. Use the `Execution*Effects` modules for `ContractSpec` transport, `ExecutionPath` for stable call-tree locations, and the `Execution*StateTrace` modules for ordered world-state replay. The explicit state-gas premise supports execution extraction only: it does not provide modern refund, touched-account, no-deletion, request-enablement or reward-free conclusions. Optional stages contribute no frames when skipped. Raw traversal includes rolled-back entries; settled traversal retains the full message and CREATE settlement tests. List order and committed-to-raw membership do not prove occurrence uniqueness, state chronology, target survival or historical contract preservation. Probe: Blanc/ExecutionTrace.lean:ExecutionTrace.exists_messageCallTrace. Measured cost: unmeasured guidance; this adaptation reanchors existing advice and reports no new timing. Simplest alternative tried: no new comparison run; the cited existing declaration is the direct manual route. Date: 2026-11-06."

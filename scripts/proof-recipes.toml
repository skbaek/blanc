[[recipe]]
id = "call-boundary-outcomes"
status = "active"
triggers = [
  "goal-head:Func.ExecSat",
  "goal-head:Prog.ExecSat",
  "goal-head:Func.ExecWitness",
  "goal-head:StaticcallObservation",
  "goal-head:StaticcallRouting",
]
preferred_path = "For an actual STATICCALL on any outcome, import Blanc.StaticcallObservation. Use Ninst.staticcall_observation with the original filled slot and arbitrary-result StepRun, or Exec.NinstOccurrence.staticcall_observation on the full actual occurrence. The result preserves the exact spawn/message/resume and classifies native versus VM entry without a flag or output filter. For an already supplied zero-value ProcessMessage, use staticcall_routing_of_process to recover the exact enabled native executePrecomp route or the original VM child and raw/settled relation. Use the `ForwardCall` module and the live `ExecSat`/`ExecWitness` layer to cross calls or package multiple outcomes. At a proof-carrying `DELEGATECALL` boundary, use `DelegatecallSpawnDescriptor.step` for the exact spawn and `.crossing` for the entered child's successful continuation instead of reconstructing the descriptor fields at the consumer. To construct the compiled call from a retained child and exact resume equation, use `DelegatecallSpawnDescriptor.runCompiled_of_certificate`. When an existing compiled call step has already resumed, use `DelegatecallSpawnDescriptor.settled_of_runCompiled` to obtain a `DelegatecallSettledBoundary` with the exact retained child and parent observations. Use `DelegatecallSettledBoundary.memory_image_of_outputSize_zero` to carry a proof-carrying memory image across a zero-output child resume. To invert an existing source `Ninst.Run` over a direct call with known operands, use the `Blanc/LadderBase.lean` inversion pair: `of_run_call_val_with_depth_frame` for the 7-operand CALL prefix (failed arm: flag `0` + `Devm.WorldEq`; entered arm: `Ninst.StepRun`, depth, exact parent/message/resume equations; compat projections `of_run_call_val_with_depth`, `of_run_call_val`) and `of_run_staticcall_val_with_depth_cause` for the 6-operand STATICCALL prefix (failed arm carries `StatcallFailureCause`; compat projection `of_run_staticcall_val_with_depth`). For an actual empty recursive slot and a nonzero success flag, `Xinst.call_none_precompile` (seven operands) and `Xinst.staticcall_none_precompile` (six operands) in `Lift.TargetLogEvents` identify an enabled precompile at the original target; an empty retained queue alone cannot distinguish a precompile from interpreted code with no retained views. When the actual pc, recursive slot, `Xlot.Filled` and `Ninst.StepRun` are already available, use `of_step_call_val_with_depth_frame` for CALL or `of_step_staticcall_val_with_depth_frame_cause` for STATICCALL to retain that same slot and exact spawn; it does not establish child order or root commitment. Dismiss the failed arm with the trailing `iszero`+guard, align the entered step with `Ninst.StepRun.unique_exec_of_filled`, and take `RawCommits` from `ProcessMessage.settlementCommits_of_some_ok_clean`. For child code/address from a spawn equation without operand knowledge, use the `Blanc/CommonProofs/Messages.lean` spawn-source family: the `Xinst.step_spawn_source` trichotomy (whose same-target disjunct is explicitly open), `Xinst.step_spawn_codeAddress_eq_currentTarget`, and `Evm.step_spawn_child` for the away-from-parent cases. For same-target STATICCALL use `Xinst.step_staticcall_sameTarget_code` with nondelegation evidence. To restrict which Xinst family a checked certificate cursor reaches, use `Cursor.execsSatisfy_of_reachable` and `CursorOK.execsSatisfy` from `Lift.CallRestriction`."
boundary = "Do not duplicate the settlement/determinism tail, and do not infer deadness from qualified-name grep alone. CALL (7 operands, value, stipend) and STATICCALL (6 operands, forced static) have separate inversion statements: select by operand count, never by analogy. The inversion pair inverts an existing run and never manufactures liveness from a prefix; the spawn-source trichotomy's same-target disjunct is open for arbitrary instructions; the dedicated STATICCALL theorem requires nondelegation. Cursor family restrictions do not assert child commitment or effects. The three STATICCALL triggers match only their exact raw Blanc heads, without unfolding aliases or nested goals. Native slot.none is an entered invocation; flag0 or empty bytes do not prove absence. No selector enumeration, R3 relevance, cryptographic exclusion, historical lift or root commitment follows. Probe: Blanc/StaticcallObservation.lean:Exec.NinstOccurrence.staticcall_observation. Measured cost: unmeasured guidance; this adaptation reanchors existing advice and reports no new timing. Simplest alternative tried: no new comparison run; the cited existing declaration is the direct manual route. Date: 2026-11-08."

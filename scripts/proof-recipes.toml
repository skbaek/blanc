[[recipe]]
id = "trace-admitted-frame-invariant"
status = "active"
triggers = ["goal-head:ContractSpec.PreservesAdmitted"]
preferred_path = "State the target program obligation as `ContractSpec.SoundAdmitted ca entry`, keeping the concrete `Exec.FrameAdmitted` premise result-free, then apply `ContractSpec.preserves_inv_admitted`. For certified code with a storage-only invariant, `ContractSpecSem.ofStorageOnly` supplies its balance/transfer adapter. Derive retained-history admission from an independent predicate on actual raw roots with `ConfiguredHistoryTrace.frameAdmitted_iff_rawFrames`. Use `Exec.FrameAdmitted.root` at the selected target entry and the named child/continuation restriction lemmas rather than rebuilding raw-frame list membership. When the program proof needs the ordinary message-entry empty stack and memory, conjoin its independent premise with `Exec.FreshEntry` using `Exec.FrameAdmitted.and`; retained wrappers derive the fresh half through their `freshFrameAdmitted` theorem. Drop to `preserves_lift_admitted` or `lift_inv_admitted` only when the standard `ContractSpec.PreWf` carrier is insufficient. For an observed replay of deployed bytecode, instantiate `AccountingLadderAdmitted` with a `ContractSpecSem`, actual-frame admission and an observed root law, then use `configuredHistory` to recover exactly the retained settled-frame observations. Build its root law with `Exec.coreAccounting` when target observations are empty in static runs; `messageRoot_facts` derives entry location and balance bounds from actual message preparation."

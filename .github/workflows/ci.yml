name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref: a newer push cancels the older run instead of
# stacking a second build (which recompiles jaune from source) on a superseded
# commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      - name: Published audited-theorem count
        run: scripts/check-doc-counts.sh
      # Static and fail-closed: it reads committed files only, so it needs no
      # Lean toolchain, no build and no network, and fails in well under a
      # second when the assurance register stops describing the tree.
      - name: Lido CircuitBreaker assurance register
        run: scripts/check-lido-circuit-breaker-assurance.sh
      - name: Proof-resource ceiling debt
        run: scripts/check-proof-debt.sh
      - name: Proof-duplication ratchet
        run: scripts/check-proof-duplication.sh
      - name: Registered proof residue ratchet
        run: scripts/check-proof-residue.sh
      # Ahead of the toolchain deliberately: this gate reads .lean files only,
      # so it needs no Lean, no build and no network, and fails in under a
      # second when a contract reaches into another contract's modules.
      - name: Import hierarchy (contracts are siblings)
        run: scripts/check-layering.sh
      - name: Execution-settlement extraction ownership
        run: scripts/check-extraction-ownership.sh
      - name: Imported source trust surface
        run: scripts/check-trust-surface.sh
      - name: Deployed WETH10 reference lock (offline)
        run: scripts/check-weth10-reference.sh
      - name: Lido CircuitBreaker reference lock (offline)
        run: scripts/check-lido-circuit-breaker-reference.sh
      - name: Lido TWG reference lock (offline)
        run: scripts/check-lido-twg-reference.sh
      # The Lido dispatcher and both differential matrices remain mandatory
      # local candidate gates. The narrowly provisioned EELS checkout below is
      # owned by the deployment-root singleton replay only.
      - uses: leanprover/lean-action@v1
      - name: Lido CircuitBreaker Registry RI7 assurance
        run: scripts/check-lido-circuit-breaker-registry.sh
      - name: Lido CircuitBreaker enumeration and observability S3 assurance
        run: scripts/check-lido-circuit-breaker-enumeration.sh
      - name: Lido CircuitBreaker access and temporal-authority S5 assurance
        run: scripts/check-lido-circuit-breaker-access.sh
      - name: Lido CircuitBreaker Registry-history S7 assurance
        run: scripts/check-lido-circuit-breaker-history.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Checkout pinned execution-specs for deployment-root replay
        uses: actions/checkout@v6
        with:
          repository: ethereum/execution-specs
          ref: 4198b9c5996713b268aed602739d5aa40e277694
          path: execution-specs
          fetch-depth: 1
      - name: Install pinned execution-specs environment
        run: |
          python -m venv execution-specs/venv
          execution-specs/venv/bin/python -m pip install --disable-pip-version-check -e execution-specs
      - name: Build the Jaune fixture runner
        run: lake build jaune/jaune
      - name: Lido CircuitBreaker direct deployment-root S9 assurance
        env:
          EELS_ROOT: ${{ github.workspace }}/execution-specs
        run: scripts/check-lido-circuit-breaker-deployment.sh
      - name: Lido launch/current artifact ownership ledgers (offline)
        run: scripts/check-lido-circuit-breaker-artifact-profile.sh
      - name: Lido constructor emitted-byte schema (offline)
        run: scripts/check-lido-circuit-breaker-constructor.sh
      - name: Lido runtime error-table schema (offline)
        run: scripts/check-lido-circuit-breaker-runtime-errors.sh
      - name: Execution-settlement CREATE rollback regression
        run: scripts/check-execution-settlement.sh
      - name: Execution-occurrence semantic regression
        run: scripts/check-execution-occurrence.sh
      - name: Cycle-safe same-frame SSTORE-occurrence regression
        run: scripts/check-cycle-write-free.sh
      - name: Transaction-scoped transient settlement regression
        run: scripts/check-transient-settlement.sh
      - name: Error(string) payload cross-derivation (offline)
        run: scripts/check-error-data.sh
      - name: Audit headline theorem axioms
        run: scripts/check.sh --no-build
      - name: Pin WETH10/Lido artifact statements
        run: scripts/check-claims.sh
      - name: WETH fixture suite (Jaune vs frozen EELS on the witnessed bytes)
        run: scripts/check-weth.sh --no-build
      - name: PRORATA fixture suite (Jaune vs frozen EELS on the witnessed bytes)
        run: scripts/check-prorata.sh --no-build
      - name: WETH selector coverage (shrink-only budget)
        run: scripts/check-weth-coverage.sh
      - name: fmint fixture suite (Jaune vs frozen EELS on the witnessed bytes)
        run: scripts/check-fmint.sh --no-build
      - name: fmint selector coverage (shrink-only budget)
        run: scripts/check-fmint-coverage.sh

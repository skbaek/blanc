name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Reconstruct and verify two native Linux runtimes
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          out = root / '.lake/native-runtime-evidence'
          out.mkdir(parents=True)
          cache = pathlib.Path(os.environ['RUNNER_TEMP']) / 'blanc-runtime-artifacts'
          a = pathlib.Path('/tmp/blanc-runtime-reconstruction-linux-a')
          b = pathlib.Path('/tmp/blanc-runtime-reconstruction-linux-b')
          lock = root / 'scripts/current-mainnet-runtime-lock.json'
          before = json.loads(lock.read_text())
          assert before['platforms']['linux-x86_64']['targetSitePackages']['representation'] == 1
          commands = []
          def run(argv, name, expected=0, env=None):
              commands.append({'argv': argv, 'log': name, 'expected_exit': expected})
              with (out/name).open('wb') as log:
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, env=env)
              assert result.returncode == expected, (argv, result.returncode, (out/name).read_text())
          def setup(path):
              return ['python3', 'scripts/setup-current-mainnet.py', '--root', str(path), '--cache', str(cache), '--install-python']
          run(setup(a), 'first-construction.log', expected=1)
          text = (out/'first-construction.log').read_text()
          constructed, end = json.JSONDecoder().raw_decode(text)
          assert constructed['status'] == 'CONSTRUCTED' and constructed['platform'] == 'linux-x86_64'
          assert text[end:].strip() == ('SETUP FAILED — current-mainnet: runtime lock linux-x86_64 is historical installation-specific evidence, not a recoverable recipe; see docs/CURRENT_MAINNET_SETUP.md\n'
              'See docs/CURRENT_MAINNET_SETUP.md; do not refresh the runtime lock to accept a failed installation.')
          run(['python3', 'scripts/gen-current-mainnet-runtime-lock.py', '--write', '--root', str(a)], 'native-owner-generation.log')
          after = json.loads(lock.read_text())
          assert before['target'] == after['target'] and before['schema'] == after['schema']
          assert before['platforms']['macos-arm64'] == after['platforms']['macos-arm64']
          assert before['platforms']['linux-x86_64']['pythonExecutableSha256'] == after['platforms']['linux-x86_64']['pythonExecutableSha256']
          assert after['platforms']['linux-x86_64']['targetSitePackages']['representation'] == 2
          run(['scripts/check-current-mainnet.sh'], 'first-current-mainnet.log', env=dict(os.environ, JAUNE_T8N_TARGET=str(a)))
          run(setup(b), 'second-construction.log')
          run(['scripts/check-current-mainnet.sh'], 'second-current-mainnet.log', env=dict(os.environ, JAUNE_T8N_TARGET=str(b)))
          run(['python3', 'scripts/current_mainnet_runtime_controls.py', '--disposable-root', str(b)], 'controls.json')
          sys.path.insert(0, str(root/'scripts'))
          import current_mainnet as lane
          first, second = lane._runtime_entry(lane.target_paths(a)), lane._runtime_entry(lane.target_paths(b))
          assert first == second == after['platforms']['linux-x86_64']
          (out/'generated-runtime-lock.json').write_bytes(lock.read_bytes())
          (out/'native-lock.diff').write_bytes(subprocess.check_output(['git', 'diff', '--', 'scripts/current-mainnet-runtime-lock.json']))
          result = {'status': 'GREEN', 'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'runtime_candidate': '6c5ecbcb3baf265aaadb6514affc88f10155701e', 'runner': 'ubuntu-24.04', 'roots': [str(a),str(b)],
              'native_closure': first, 'commands': commands,
              'recipe_sha256': hashlib.sha256((root/'scripts/current-mainnet-runtime-recipe.json').read_bytes()).hexdigest(),
              'files': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out/'result.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-evidence
          path: .lake/native-runtime-evidence/
          if-no-files-found: error
          retention-days: 7

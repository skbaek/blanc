# ============================================================================
# ACTIVE — scheduled cross-repo canary (CI plan P2 / Step 7): builds blanc's proofs
# against jaune *HEAD* instead of the pinned revision, as a daily early-warning
# signal for how much proof-repair a future pin bump will cost.
#
# NON-BLOCKING BY DESIGN: never make this a required check. A red canary does
# NOT mean blanc is broken — blanc's real CI (ci.yml) builds against the PINNED
# jaune and stays green. Red just means jaune HEAD drifted in a way that will
# cost effort at the next bump. Do NOT add continue-on-error (that hides the
# signal); simply never gate merges on this workflow. Red is the signal working.
#
# MECHANISM — option B (workflow-only, no lakefile change): rewrite the pinned
# jaune commit in lakefile.lean to jaune's current main HEAD in the CI checkout
# (never committed), then `lake update jaune` + build. Option A (reintroduce an
# JAUNE_DEV path override in lakefile.lean and check jaune out as a sibling) is
# the alternative if you also want a reusable local-dev override — that needs a
# Lake-DSL edit under the repo's Lean discipline.
#
# The live dependency is resolved before the build. Cache reuse is keyed by
# toolchain, the committed manifest, the tested Jaune HEAD and this Blanc
# commit. The normal CI cache is a fallback; Lake rechecks source/dependency
# identities after the repin. Save only when every canary check succeeds.
# Run 38578979297 exhausted the unchanged 60-minute ceiling without a project
# cache. Cache restoration reduces repeated work; cold-run capacity still
# needs an observed successful run and is not inferred from a cache hit.
# ============================================================================
name: canary (blanc vs jaune@HEAD)

on:
  schedule:
    - cron: "0 9 * * *"   # offset from jaune's nightly (07:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    env:
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Re-pin jaune to main HEAD (CI checkout only — never committed)
        id: jaune-head
        run: |
          HEAD_SHA="$(git ls-remote https://github.com/skbaek/jaune.git refs/heads/main | cut -f1)"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid Jaune HEAD" >&2; exit 1; }
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          OLD_PIN="$(grep -oE '[0-9a-f]{40}' lakefile.lean | head -1)"
          echo "jaune main HEAD: $HEAD_SHA"
          echo "blanc pin:       $OLD_PIN"
          sed -i -E "s|(jaune\.git\" @ \")[0-9a-f]{40}|\1${HEAD_SHA}|" lakefile.lean
          {
            echo "### canary — blanc vs jaune@HEAD"
            echo ""
            echo "- jaune \`main\` HEAD tested: \`$HEAD_SHA\`"
            echo "- blanc's current pin:      \`$OLD_PIN\`"
            echo "- (pin delta = commits in jaune \`$OLD_PIN..$HEAD_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore project artifacts
        uses: actions/cache@v4
        with:
          # Match lean-action's default path spelling for cache-version parity.
          path: ./.lake
          key: canary-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ steps.jaune-head.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            canary-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ steps.jaune-head.outputs.sha }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # Toolchain only (no build yet): the build must happen AFTER `lake update`.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build blanc against jaune HEAD and run the axiom audit
        run: |
          lake update jaune          # re-resolve the manifest to the re-pinned HEAD
          lake exe cache get || true  # mathlib olean cache (best effort)
          scripts/check.sh            # lake build + the union axiom walk (AxiomCheck.lean) + the leaf search
